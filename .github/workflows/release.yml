name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.11.0)'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog extraction

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build brand assets
        run: python scripts/build_brand.py

      - name: Run PyInstaller
        run: pyinstaller --clean --noconfirm suprbar.spec

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          # Single source of truth: derive the installer version from the tag
          # (refs/tags/vX.Y.Z) so the asset name + metadata never drift from the
          # release. Falls back to __version__ for workflow_dispatch runs.
          $ver = "${{ github.ref_name }}" -replace '^v',''
          if (-not $ver -or $ver -eq "${{ github.ref_name }}") {
            $ver = (python -c "import suprbar; print(suprbar.__version__)")
          }
          Write-Host "Installer version: $ver"
          & $iscc /DMyAppVersion=$ver installer.iss

      - name: Zip portable bundle
        run: |
          Compress-Archive -Path dist/suprbar/* -DestinationPath dist/suprbar-portable.zip

      - name: Generate SHA256 digests
        run: |
          $files = @(Get-ChildItem dist/suprbar-setup-*.exe), @(Get-ChildItem dist/suprbar-portable.zip)
          $digests = @{}
          foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash
            $digests[$f.Name] = $hash
            "$hash  $($f.Name)" | Out-File -Append dist/SHA256SUMS.txt
          }
          # Write latest.json for future update hosting flexibility
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $latest = @{
            version = $ver
            notes = "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            published = (Get-Date).ToUniversalTime().ToString("o")
            assets = @{
              installer = @{
                name = (Get-ChildItem dist/suprbar-setup-*.exe | Select-Object -First 1).Name
                sha256 = $digests[(Get-ChildItem dist/suprbar-setup-*.exe | Select-Object -First 1).Name]
                size = (Get-Item (Get-ChildItem dist/suprbar-setup-*.exe | Select-Object -First 1).FullName).Length
              }
              portable = @{
                name = "suprbar-portable.zip"
                sha256 = $digests["suprbar-portable.zip"]
                size = (Get-Item dist/suprbar-portable.zip).Length
              }
            }
          }
          $latest | ConvertTo-Json | Out-File -Encoding utf8 dist/latest.json

      - name: Extract changelog section
        id: changelog
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          $cl = Get-Content CHANGELOG.md -Raw
          # Extract the section for this version (## vX.Y.Z … until next ##)
          $pattern = "(?s)## v$([regex]::Escape($ver))[^\n]*\n(.*?)(?=\n## v|\z)"
          if ($cl -match $pattern) {
            $body = $matches[1].Trim()
            # GitHub release body max ~125KB; truncate if needed
            if ($body.Length -gt 120000) { $body = $body.Substring(0, 120000) + "`n`n… (truncated — see CHANGELOG.md for full notes)" }
            "body<<EOF`n$body`nEOF" | Out-File -Encoding utf8 $env:GITHUB_OUTPUT
          } else {
            "body<<EOF`nRelease ${{ github.ref_name }}`nEOF" | Out-File -Encoding utf8 $env:GITHUB_OUTPUT
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suprbar-windows
          path: |
            dist/suprbar-setup-*.exe
            dist/suprbar-portable.zip
            dist/SHA256SUMS.txt
            dist/latest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/suprbar-setup-*.exe
            dist/suprbar-portable.zip
            dist/SHA256SUMS.txt
            dist/latest.json
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
