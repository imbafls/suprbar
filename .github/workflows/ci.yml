name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check suprbar tests

      - name: Mypy
        run: python -m mypy suprbar

      - name: Tests
        run: python -m pytest tests -q

      - name: Pricing self-test
        run: python -m suprbar.pricing
