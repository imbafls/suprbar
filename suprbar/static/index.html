<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>supr.bar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="fly" id="fly">
    <header class="head">
      <span class="brand">supr<b>.</b>bar</span>
      <span class="pill" id="status" data-state="idle"><i></i><span id="statusText">idle</span></span>
      <span class="grow"></span>
      <button class="ibtn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button class="ibtn" id="pinBtn" title="Keep open" aria-label="Keep open" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 15v5"/></svg>
      </button>
      <button class="ibtn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12.5a7 7 0 0 0 .1-1l1.5-1.2-1.5-2.6-1.9.5a7 7 0 0 0-1.6-1L15 4h-3l-.3 2.2a7 7 0 0 0-1.6 1l-1.9-.5L6.7 9.3 8.2 10.5a7 7 0 0 0 0 1.9L6.7 13.6l1.5 2.6 1.9-.5a7 7 0 0 0 1.6 1L12 19h3l.3-2.2a7 7 0 0 0 1.6-1l1.9.5 1.5-2.6-1.5-1.2z"/></svg>
      </button>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-range="today" aria-selected="true">Today</button>
      <button role="tab" data-range="7d">7d</button>
      <button role="tab" data-range="30d">30d</button>
      <button role="tab" data-range="90d">90d</button>
    </nav>

    <section class="hero">
      <div class="cost num" id="cost">$—</div>
      <div class="sub" id="sub">loading…</div>
      <div class="burn num" id="burn" hidden></div>
    </section>

    <div class="sources" id="sources"></div>
    <div class="bars" id="bars" aria-hidden="true"></div>

    <section class="lists">
      <div><h3>Projects</h3><ol id="projects"></ol></div>
      <div><h3>Models</h3><ol id="models"></ol></div>
    </section>

    <footer class="foot">
      <span id="updated">—</span>
      <span class="grow"></span>
      <button class="tbtn accent" id="updateBtn" hidden></button>
      <button class="tbtn" id="reportBtn">Report</button>
    </footer>
  </main>

  <section class="sheet" id="sheet" hidden aria-label="Settings">
    <header class="head">
      <span class="brand">Settings</span>
      <span class="grow"></span>
      <button class="ibtn" id="sheetClose" title="Close" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="sheet-body">
      <h3>Sources</h3>
      <div id="srcRows"></div>
      <h3>General</h3>
      <label class="row">
        <span>Mini overlay<small>Always-on-top chip with the last 24h</small></span>
        <input type="checkbox" data-path="mini.enabled" />
      </label>
      <label class="row">
        <span>Keep flyout open<small>Don't hide when you click elsewhere</small></span>
        <input type="checkbox" data-path="ui.pinned" />
      </label>
      <label class="row">
        <span>Start on login<small>Launch supr.bar when you sign in</small></span>
        <input type="checkbox" data-path="ui.start_on_login" />
      </label>
      <label class="row">
        <span>Check for updates<small>At launch and every 6 hours</small></span>
        <input type="checkbox" data-path="updates.check_on_launch" />
      </label>
    </div>
    <footer class="foot"><span id="version"></span></footer>
  </section>

  <script src="/app.js"></script>
</body>
</html>
