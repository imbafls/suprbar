<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>supr.bar mini</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/mini.css" />
</head>
<body class="mini">
  <!-- chip: live dot · last-24h cost · $/h while live · × -->
  <div class="m-chip">
    <i class="pip" aria-hidden="true"></i>
    <button class="open num" id="cCost" type="button" title="Open supr.bar">$—</button>
    <span class="burn num" id="cBurn"></span>
    <button class="x" id="closeBtn" type="button" title="Hide overlay" aria-label="Hide overlay">&#215;</button>
  </div>

  <!-- hover card -->
  <div class="m-card">
    <div class="top">
      <i class="pip" aria-hidden="true"></i>
      <span class="what" id="fLive">idle</span>
      <button class="x" id="closeBtn2" type="button" title="Hide overlay" aria-label="Hide overlay">&#215;</button>
    </div>
    <button class="open num big" id="fCost" type="button" title="Open supr.bar">$—</button>
    <div class="meta" id="fMeta">last 24h</div>
    <div class="meta" id="fToday"></div>
  </div>

  <script src="/mini.js"></script>
</body>
</html>
